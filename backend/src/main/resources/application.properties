# Schema só pelo Flyway (nome atual: schema-management.strategy; database.generation é o antigo).
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Colunas jsonb (audit_events.details, passo 303): o Hibernate reusa o mapeador Jackson que o Quarkus
# pré-configura a partir do ObjectMapper da aplicação. O default (fail) recusa esse compartilhamento
# quando o mapper interno do Hibernate diverge do dos endpoints REST — aqui, o
# write-dates-as-timestamps=false que o Quarkus aplica por padrão. A mitigação documentada para quem
# não customiza a serialização é ignorar a checagem; é um ajuste de transição (o Quarkus vai remover
# os mapeadores pré-configurados), então quando a aplicação precisar de um mapeador próprio para o
# banco, a saída é um bean FormatMapper com @JsonFormat.
quarkus.hibernate-orm.mapping.format.global=ignore

# Seed de desenvolvimento: repeatable R__seed_dev.sql, fora de db/migration para nunca ir a %prod.
# Em %test também roda, para os testes de integração exercitarem a idempotência do seed.
%dev.quarkus.flyway.locations=classpath:db/migration,classpath:db/seed-dev
%test.quarkus.flyway.locations=classpath:db/migration,classpath:db/seed-dev

# Logs estruturados em JSON (MDC no campo "mdc") em produção; em dev/test fica o formato legível.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Banco de desenvolvimento: serviço postgres do docker-compose (valores espelhados em .env.example).
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/minimarket
%dev.quarkus.datasource.username=minimarket
%dev.quarkus.datasource.password=minimarket

# Banco do container (compose): só o tipo é fixado aqui; URL/usuário/senha vêm do ambiente
# (QUARKUS_DATASOURCE_* no serviço app do docker-compose).
%prod.quarkus.datasource.db-kind=postgresql

# Loja atual do MVP (§5.4): resolvida por configuração, nunca por parâmetro do cliente.
minimarket.store.default-code=MATRIZ

# ADMIN inicial (passo 115): semeado no startup somente quando a senha inicial está configurada.
# Em %dev a senha vem da variável ADMIN_INITIAL_PASSWORD (default de dev documentado no README);
# em %test e %prod não há default — sem a variável o inicializador não faz nada.
minimarket.security.admin.username=admin
%dev.minimarket.security.admin.initial-password=${ADMIN_INITIAL_PASSWORD:admin123}

# Hash de senha (§6.2): Argon2id com os parâmetros recomendados pela OWASP (m=19 MiB, t=2, p=1).
minimarket.security.password.memory-kib=19456
minimarket.security.password.iterations=2
minimarket.security.password.parallelism=1
minimarket.security.password.salt-length=16
minimarket.security.password.hash-length=32

# Sessão (§6.2): expiração absoluta de 12 h (nunca estendida) e idle timeout por cliente — o Web é
# sessão curta e a TUI fica em operação contínua. O login (passo 204a) grava expires_at = agora +
# expiração absoluta e o marco zero de last_seen_at; o idle é validado a cada requisição (passos
# 206/209).
minimarket.security.session.absolute-expiration=12h
minimarket.security.session.idle.web=30m
minimarket.security.session.idle.tui=8h

# Atividade da sessão (§6.2, passo 206): last_seen_at é atualizado no máximo 1x/min por sessão —
# sem isso seria um write por request. A decisão é do caso de uso, com o Clock injetado.
minimarket.security.session.touch-interval-seconds=60

# Política de autenticação das rotas (passo 307a): a janela aberta desde a Fase 1 fechou — toda a
# API exige token. As políticas por rota que existiam antes (as de /auth/* e as três de teste que
# provavam o mecanismo bearer) foram substituídas por esta, única para todo o /api/v1.
#
# Por que política por rota e não só as anotações (@Authenticated/@RequirePermission): a anotação
# sozinha devolve 401 SEM CORPO — o mapper de segurança do JAX-RS só copia o challenge, não chama o
# sendChallenge do mecanismo (achado do passo 207). O 401 problem+json nasce no challenge do
# mecanismo bearer, e ele só roda quando existe política por rota exigindo autenticação.
quarkus.http.auth.permission.api.paths=/api/v1/*
quarkus.http.auth.permission.api.policy=authenticated

# Exceções públicas: o path exato vence o wildcard acima pela regra "longest path wins" da
# autorização por configuração do Quarkus (subpath precede root path) — o login é como o cliente
# obtém o token, o /meta abre o app antes de autenticar e os endpoints de saúde são do operador da
# infraestrutura, não da API.
quarkus.http.auth.permission.public.paths=/api/v1/auth/login,/api/v1/meta,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit

# Lock por tentativas de login (§6.3.1, passo 204b): após 5 falhas consecutivas o usuário fica
# bloqueado por 15 min; o login bem-sucedido (ou o bloqueio expirado) zera o contador e o lock.
# A falha de credenciais ainda paga um atraso fixo antes do 401 (§6.3.2, passo 211) — o 423 do
# bloqueio não paga: a conta já está fora do ar e o atraso só puniria o cliente legítimo.
minimarket.security.login.max-attempts=5
minimarket.security.login.lock-minutes=15
minimarket.security.login.failure-delay-ms=400

# Rate limit de tentativas de login por IP (§6.3.5, passo 212): janela fixa de 5 min com teto de 20
# falhas por IP — a 21ª tentativa do mesmo IP responde 429 RATE_LIMITED com Retry-After antes de
# processar qualquer coisa, mesmo com a senha certa. Falha de credenciais (401) e conta bloqueada
# (423) contam; login bem-sucedido limpa a contagem do IP, para um NAT compartilhado não herdar a
# falha de um operador. O IP é o remoteAddress() da conexão: X-Forwarded-For não é confiado
# enquanto a aplicação puder ser acessada direto (seria spoofável). É um paliativo em memória,
# válido para uma instância: o limite definitivo é do proxy reverso (passo 1305 da Fase 13, citado
# como 1402 no passo 212) e este contador deve ser removido quando ele entrar.
minimarket.security.login.rate-limit.max-attempts=20
minimarket.security.login.rate-limit.window=5m

# Idempotência de requisições (§8, passo 607a): validade gravada em idempotency_keys.expires_at =
# agora + TTL. É a janela em que a chave pode ser reenviada; quem apaga as linhas vencidas é o job
# diário do passo 1004 (cron abaixo). O replay em si não filtra a validade: enquanto a linha
# existir, vale.
minimarket.idempotency.ttl=24h

# Limpeza das chaves vencidas (passo 1004): 03:00 todo dia, no fuso da JVM (sintaxe Quartz, a
# padrão do quarkus-scheduler). O horário só decide quando a tabela é varrida — o corte é
# expires_at <= agora, feito pelo caso de uso com o Clock da aplicação.
minimarket.idempotency.cleanup-cron=0 0 3 * * ?

# A suíte exercita a limpeza chamando o caso de uso direto, com relógio controlado: o job não roda
# nos testes, então o resultado não depende do relógio do CI nem de esperar o agendamento.
%test.quarkus.scheduler.enabled=false
