# Schema só pelo Flyway (nome atual: schema-management.strategy; database.generation é o antigo).
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Logs estruturados em JSON (MDC no campo "mdc") em produção; em dev/test fica o formato legível.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Banco de desenvolvimento: serviço postgres do docker-compose (valores espelhados em .env.example).
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/minimarket
%dev.quarkus.datasource.username=minimarket
%dev.quarkus.datasource.password=minimarket

# Loja atual do MVP (§5.4): resolvida por configuração, nunca por parâmetro do cliente.
minimarket.store.default-code=MATRIZ
