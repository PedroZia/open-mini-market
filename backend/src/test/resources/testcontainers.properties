# Reuso do container de Dev Services entre execuções (escopo do projeto, não do usuário).
#
# Hoje não funciona com Quarkus 3.33 + Testcontainers 2.0.4: a checagem de reuso ignora este arquivo
# do classpath (só valem a variável TESTCONTAINERS_REUSE_ENABLE e o arquivo do usuário) e o hash de
# reuso (SHA1 do CreateContainerCmd) inclui o label io.quarkus.devservice.process-uuid, que muda a
# cada execução. Atenção: ligar a variável faz o Testcontainers gravar reuse.enable=true no arquivo
# do usuário (afeta todos os projetos da máquina) e cada execução deixa um container rodando.
testcontainers.reuse.enable=true
