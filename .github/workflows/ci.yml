name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build e testes
        working-directory: backend
        run: ./mvnw -B verify

  node:
    name: Node (TUI/Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detecta código TypeScript
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configura Node 22
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Testes e checagem de tipos
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm ci
            npm test
            npm run typecheck
          else
            echo "Sem package.json na raiz: ainda não há código TypeScript (Fases 11 e 12)."
          fi
