# Serviços de desenvolvimento. Variáveis em .env (copie de .env.example).
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minimarket}
      POSTGRES_USER: ${POSTGRES_USER:-minimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minimarket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # No postgres:18 o VOLUME da imagem é /var/lib/postgresql (PGDATA por versão).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # API em container (build em backend/Dockerfile). Sobe só depois do banco saudável.
  app:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Host = nome do serviço postgres; credenciais espelham o serviço acima.
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-minimarket}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-minimarket}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-minimarket}
      # ADMIN inicial do %prod (passo 115): em %prod não há senha default e sem ela o backend de um
      # banco novo não semeia ADMIN nenhum — o login do E2E (admin/admin123) não teria a quem
      # autenticar. O nome da variável é o que o SmallRye Config mapeia para
      # `minimarket.security.admin.initial-password`; o valor default espelha o %dev/.env.example.
      MINIMARKET_SECURITY_ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
    ports:
      - "${APP_PORT:-8080}:8080"

  # Retaguarda web (passo 1214): imagem com Node no build e Caddy no runtime — serve o build da SPA
  # e faz proxy de `/api` para o `app`, então navegador e API ficam na **mesma origem** (sem CORS).
  # O contexto é a raiz do monorepo (workspace `@minimarket/api-client`); `.dockerignore` na raiz.
  # Subir: `docker compose up -d --build` e acessar http://localhost:${WEB_PORT:-8082}
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Upstream do reverse_proxy do web/Caddyfile (nome do serviço + porta interna do app).
      API_UPSTREAM: app:8080
    ports:
      - "${WEB_PORT:-8082}:80"

volumes:
  postgres-data:
